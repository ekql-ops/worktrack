spring:
  application:
    name: worktrack-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/worktrack}
    username: ${DATABASE_USERNAME:worktrack}
    password: ${DATABASE_PASSWORD:worktrack}
    hikari:
      # Tuned for a serverless Postgres (Neon) that suspends when idle and
      # takes a few seconds to wake. The defaults assume a database that is
      # always there: they hold connections open past the point the provider
      # has dropped them, then hand out dead ones.
      maximum-pool-size: 5
      minimum-idle: 0
      # Long enough to cover the database waking up.
      connection-timeout: 30000
      # Both sit under a typical idle-suspend window, so connections are
      # retired before the provider closes them underneath us.
      idle-timeout: 60000
      max-lifetime: 240000
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate only checks the mapping matches it,
      # so a drifted entity fails at boot instead of at the first query.
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

worktrack:
  zone: ${WORKTRACK_ZONE:Europe/London}
  jwt:
    # No default. The app must be told its signing key or it will not start.
    secret: ${JWT_SECRET}
    ttl-minutes: ${JWT_TTL_MINUTES:720}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  demo:
    # Seeds the sample employees and a week of shifts. Off unless asked for.
    seed: ${DEMO_SEED:false}
    password: ${DEMO_PASSWORD:}

server:
  port: ${PORT:8080}

logging:
  level:
    org.springframework.security: INFO
