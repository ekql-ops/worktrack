# Fly.io configuration for the WorkTrack API.
# Run `fly deploy` from this directory; the Dockerfile sits alongside.
#
# Regenerated by `fly launch`, then the explanatory comments were put back
# and a duplicate memory key removed. The values below are deliberate — if
# you re-run `fly launch` it will flatten this file again.

app = 'worktrack-api'
primary_region = 'lhr'          # London, nearest the users this is for

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'
  WORKTRACK_ZONE = 'Europe/London'
  # The JVM does not read a container's memory limit on its own; without
  # this it sizes the heap for the host and gets OOM-killed.
  JAVA_OPTS = '-XX:MaxRAMPercentage=70 -XX:+UseSerialGC'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # Scales to zero when idle, so an unused demo costs nothing to run. The
  # first request after a quiet spell pays a JVM cold start of a few seconds.
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    # Spring Boot needs a moment before it answers; without the grace period
    # the machine is killed as unhealthy while it is still starting.
    grace_period = '45s'
    method = 'GET'
    path = '/actuator/health'

[[vm]]
  size = 'shared-cpu-1x'
  # Fly's 256mb default is not enough for a JVM running Hibernate and a
  # connection pool. `fly launch` also wrote memory_mb = 512, which says the
  # same thing twice; the redundant key is removed.
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
