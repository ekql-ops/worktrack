# Fly.io deployment for the WorkTrack API.
# Run `fly deploy` from this directory (the Dockerfile sits alongside).
#
# `app` must be unique across all of Fly, so `fly launch` may rename it.
# If it does, change it here to match or later deploys will target the
# wrong app.

app = "worktrack-api"
primary_region = "lhr"          # London, closest to the users this is for

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  WORKTRACK_ZONE = "Europe/London"
  # The JVM does not read the container's memory limit as a percentage on
  # its own; without this it sizes the heap for the host and gets OOM-killed.
  JAVA_OPTS = "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Scales to zero when idle. The first request after a stop pays a cold
  # start, which for a Spring Boot JVM is a few seconds — acceptable for a
  # portfolio demo, not for anything with real users.
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "45s"        # Spring Boot needs time before it answers
    interval = "30s"
    method = "GET"
    path = "/actuator/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  # 256mb is the default and is not enough for a JVM with Hibernate and a
  # connection pool. This is the smallest size that starts reliably.
  memory = "512mb"
  cpus = 1
