name: deploy

# Rebuilds and republishes the demo whenever main changes.
# Also runnable by hand from the Actions tab.
on:
  push:
    branches: [main]
    # The backend has its own workflow; changing it should not trigger a
    # rebuild and redeploy of an unchanged frontend.
    paths-ignore:
      - "backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead, and let a run in
# progress finish rather than shipping a half-built site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # react-scripts 5 predates the newest Node lines; 20 is the
      # most recent version it is reliably happy on.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # Pages would otherwise run the output through Jekyll, which
      # strips directories beginning with an underscore.
      - name: Disable Jekyll
        run: touch build/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
